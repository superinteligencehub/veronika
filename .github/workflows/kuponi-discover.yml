name: Kuponi LV — поиск новых магазинов

# Раз в неделю заново проверяет все домены из kuponi/scrapers/registry/candidates.txt:
# какая платформа, есть ли публично цены со скидкой, не закрыт ли сайт. Результат —
# kuponi/scrapers/registry/stores.json, его подхватывает ежедневный сбор.
# Чтобы добавить магазин — допишите строку «домен | название | категория» в candidates.txt.

on:
  schedule:
    - cron: '41 1 * * 0'   # воскресенье, ~04:41 по Риге
  workflow_dispatch:
  push:
    paths:
      - 'kuponi/scrapers/registry/candidates.txt'
      - 'kuponi/scrapers/registry/overrides.json'

permissions:
  contents: write

concurrency:
  group: kuponi-discover
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: kuponi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kuponi/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/discover.js
      - name: Сохранить реестр
        run: |
          git config user.name "kuponi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scrapers/registry/stores.json
          git diff --cached --quiet && exit 0
          git commit -m "Kuponi LV: обновлён реестр магазинов"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
