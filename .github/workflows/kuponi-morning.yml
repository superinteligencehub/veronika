name: Kuponi LV — утреннее уведомление (ntfy)

# Резервный канал уведомлений без своего сервера: приложение ntfy (Android) подписано на тему,
# GitHub Actions в 08:00 по Риге отправляет туда топ-5 дня. Включается переменной репозитория
# NTFY_TOPIC (Settings → Secrets and variables → Actions → Variables). Основной канал — Web Push
# через Cloudflare Worker (kuponi/worker), ему этот workflow не нужен.
# По умолчанию используется тема из kuponi/web/config.js (ntfyTopic); переменная NTFY_TOPIC её заменяет.

on:
  schedule:
    # 05:00 и 06:00 UTC — одно из них 08:00 по Риге (лето/зима); скрипт сам проверяет час
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: kuponi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scrapers/notify-ntfy.js ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC || 'kuponi-lv-d4208b90d063' }}
          KUPONI_APP_URL: ${{ vars.KUPONI_APP_URL || 'https://superinteligencehub.github.io/veronika/kuponi/web' }}
