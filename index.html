<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:description" content="Нажмите, чтобы открыть приглашение">

<style>
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: the invitation video fills the screen. A small glass pill in the
   bottom-right corner of the video opens the Waze route once the address is on screen. */
:root {
  --ink: #050e0f;
  --gold: #e6c27a;
  --gold-hi: #ffe29a;
  --cream: #f4e8cc;
  --glass: rgba(5, 14, 15, .58);
  --line: rgba(230, 194, 122, .55);
  --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: radial-gradient(70% 50% at 50% 38%, #123a37 0%, #0a2423 45%, #050e0f 100%) fixed, var(--ink);
  color: var(--cream);
  font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.app { height: 100%; display: flex; align-items: center; justify-content: center; }
.stage { position: relative; height: 100%; width: min(100%, calc(100svh * 9 / 16)); min-height: 0; }
video { display: block; width: 100%; height: 100%; object-fit: contain; background: transparent; cursor: pointer; }

.play {
  position: absolute; left: 50%; top: 71%; transform: translate(-50%, -50%);
  width: 104px; height: 104px; border-radius: 50%; border: 0; cursor: pointer; padding: 0;
  background: radial-gradient(circle at 50% 28%, #2c6a66 0%, #0f3735 62%, #0a2423 100%);
  box-shadow: 0 0 0 3px var(--gold), 0 0 0 5px rgba(255,226,154,.25), 0 0 46px rgba(230,170,70,.5);
  display: flex; align-items: center; justify-content: center;
  animation: breathe 2.4s ease-in-out infinite;
  transition: opacity .5s ease, visibility .5s;
}
.play i { width: 0; height: 0; margin-left: 8px; border-left: 30px solid #fcf4de; border-top: 19px solid transparent; border-bottom: 19px solid transparent; }
.play.gone { opacity: 0; visibility: hidden; pointer-events: none; }
@keyframes breathe { 0%, 100% { transform: translate(-50%, -50%) scale(1) } 50% { transform: translate(-50%, -50%) scale(1.06) } }

.corner {
  position: absolute; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 8px;
  opacity: 0; visibility: hidden; transform: translateY(6px);
  transition: opacity 1s ease, transform 1s ease, visibility 1s;
}
.corner.show { opacity: 1; visibility: visible; transform: none; }
.chip {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 40px; padding: 0 14px 0 12px; border-radius: 999px;
  background: var(--glass); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  color: var(--cream); text-decoration: none; cursor: pointer;
  font: 600 14px/1 var(--body); letter-spacing: .02em;
  transition: background .2s ease, border-color .2s ease;
}
.chip:hover { background: rgba(20, 66, 62, .75); border-color: var(--gold); }
.chip svg { width: 17px; height: 17px; flex: none; color: var(--gold); }
/* A soft golden glow and a slow light sweep draw the eye to one button: "Подтвердить" first, "Детали" once the guest has answered */
#rsvpOpen, #infoOpen { position: relative; overflow: hidden; isolation: isolate; }
.chip.glow, .chip.glow:hover { background: linear-gradient(100deg, var(--gold-hi), #e0a852); border-color: rgba(255, 233, 170, .95); color: #0c2c2a; }
.chip.glow svg { color: #0c2c2a; }
#rsvpOpen::after, #infoOpen::after {
  content: ""; position: absolute; top: -20%; bottom: -20%; left: 0; width: 46%; z-index: -1; pointer-events: none;
  background: linear-gradient(100deg, transparent 0%, rgba(255, 236, 190, .55) 50%, transparent 100%);
  transform: translateX(-160%) skewX(-18deg); opacity: 0;
}
.corner.show .chip.glow { animation: rsvpGlow 3.2s ease-in-out 1.2s infinite; }
.corner.show .chip.glow::after { animation: rsvpSheen 4.2s ease-in-out 1.6s infinite; }
@keyframes rsvpGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 210, 110, 0), 0 0 10px rgba(255, 200, 90, .4), 0 0 22px rgba(230, 170, 70, .22); }
  50% { box-shadow: 0 0 0 3px rgba(255, 220, 130, .28), 0 0 20px rgba(255, 205, 100, .85), 0 0 42px rgba(235, 170, 60, .5); }
}
@keyframes rsvpSheen {
  0% { transform: translateX(-160%) skewX(-18deg); opacity: 0; }
  12% { opacity: 1; }
  45% { transform: translateX(330%) skewX(-18deg); opacity: 1; }
  55%, 100% { transform: translateX(330%) skewX(-18deg); opacity: 0; }
}
.chip.round { width: 40px; padding: 0; display: none; }
.corner.ended .chip.round { display: inline-flex; }
.chip:focus-visible, .play:focus-visible, video:focus-visible { outline: 3px solid var(--gold-hi); outline-offset: 3px; }
.corner { flex-wrap: nowrap; justify-content: flex-end; max-width: calc(100% - 20px); gap: 6px; }
.corner .chip { flex: none; white-space: nowrap; }
@media (max-width: 420px) {
  .chip { height: 38px; padding: 0 11px 0 10px; gap: 5px; font-size: 13px; }
  .chip svg { width: 15px; height: 15px; }
  .chip.round { width: 38px; padding: 0; }
}
@media (max-width: 330px) { .corner { flex-wrap: wrap; } }
.sheet {
  position: absolute; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  padding: 18px 16px 16px; border-radius: 22px;
  background: rgba(6, 22, 22, .94); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  box-shadow: 0 -10px 50px rgba(0,0,0,.5);
  transition: opacity .35s ease, transform .35s ease, visibility .35s;
}
.sheet[hidden] { display: block !important; opacity: 0; visibility: hidden; transform: translateY(16px); pointer-events: none; }
.sheet h3 { margin: 0 0 14px; font: 600 22px/1.2 Georgia, "Times New Roman", serif; font-style: italic; color: var(--gold); text-align: center; }
.sheet .x { position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: none; color: var(--cream); cursor: pointer; font-size: 22px; line-height: 1; opacity: .8; }
.field { display: block; width: 100%; height: 50px; padding: 0 16px; margin: 0 0 12px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--cream); font: 500 16px/1 var(--body); }
.field::placeholder { color: rgba(244,232,204,.5); }
.field:focus-visible { outline: 3px solid var(--gold-hi); outline-offset: 2px; }
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 12px; }
.opt { height: 50px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--cream); font: 700 16px/1 var(--body); cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
.opt[aria-pressed="true"] { background: linear-gradient(100deg, var(--gold-hi), #e0a852); color: #0c2c2a; border-color: transparent; }
.opt:focus-visible, .step button:focus-visible, .go:focus-visible, .sheet .x:focus-visible { outline: 3px solid var(--gold-hi); outline-offset: 2px; }
.step { display: flex; align-items: center; justify-content: space-between; margin: 0 0 14px; padding: 0 4px 0 16px; height: 50px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.05); font: 600 16px/1 var(--body); }
.step[hidden] { display: none !important; }
.step div { display: flex; align-items: center; gap: 4px; }
.step button { width: 42px; height: 42px; border: 0; border-radius: 50%; background: rgba(230,194,122,.16); color: var(--gold-hi); font: 700 22px/1 var(--body); cursor: pointer; }
.step output { min-width: 30px; text-align: center; font-variant-numeric: tabular-nums; }
.go { display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 999px; text-decoration: none; font: 700 17px/1 var(--body); color: #0c2c2a; background: linear-gradient(100deg, var(--gold-hi), #e0a852); box-shadow: 0 8px 26px rgba(230,170,70,.3); transition: opacity .2s; }
.go.off { opacity: .4; box-shadow: none; }
.hint { margin: 10px 0 0; min-height: 1.2em; text-align: center; font-size: 13px; color: var(--cream); opacity: .85; }
.fsbtn { position: absolute; top: 10px; right: 10px; z-index: 4; width: 40px; height: 40px; padding: 0; border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center; color: var(--gold); background: var(--glass); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.fsbtn svg { width: 18px; height: 18px; }
.fsbtn:focus-visible { outline: 3px solid var(--gold-hi); outline-offset: 3px; }
/* thank-you screen after the answer is sent */
.thanks { position: absolute; inset: 0; z-index: 7; display: flex; align-items: center; justify-content: center; text-align: center; cursor: pointer;
  background: radial-gradient(ellipse at 50% 46%, rgba(3, 14, 14, .72), rgba(3, 14, 14, .46) 70%);
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  opacity: 0; visibility: hidden; transition: opacity .6s ease, visibility .6s; }
.thanks.on { opacity: 1; visibility: visible; }
.thanks canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.thanks-in { position: relative; padding: 0 24px; transform: translateY(14px) scale(.96); transition: transform .9s cubic-bezier(.2,.8,.2,1) .15s; }
.thanks.on .thanks-in { transform: none; }
.thanks h2 { margin: 0 0 14px; font: italic 600 clamp(34px, min(11.5vw, 6.6svh), 58px)/1.1 Georgia, "Times New Roman", serif; color: var(--gold-hi); text-shadow: 0 2px 0 rgba(120, 80, 20, .55), 0 0 34px rgba(255, 210, 120, .45); }
.thanks p { margin: 0; font: 500 clamp(16px, min(4.6vw, 2.8svh), 22px)/1.45 var(--body); color: var(--cream); letter-spacing: .02em; }
.thanks small { position: absolute; left: 0; right: 0; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); font: 500 12px/1 var(--body); color: var(--cream); opacity: .5; letter-spacing: .06em; }
/* details sheet: date, address, routes, calendar, album */
#info, #sheet { max-height: calc(100% - 20px); overflow-y: auto; }
.facts { display: grid; gap: 10px; margin: 0 0 12px; }
.fact { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.05); }
.fact > svg { width: 22px; height: 22px; flex: none; margin-top: 1px; color: var(--gold); }
.fact div { flex: 1; min-width: 0; }
.fact b { display: block; font: 700 16px/1.3 var(--body); color: var(--cream); }
.fact span { display: block; margin-top: 3px; font: 500 14px/1.35 var(--body); color: var(--cream); opacity: .78; }
.copy { flex: none; align-self: center; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(230,194,122,.12); color: var(--gold-hi); font: 600 13px/1 var(--body); cursor: pointer; }
.copy:focus-visible, .act:focus-visible { outline: 3px solid var(--gold-hi); outline-offset: 2px; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.act { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--cream); text-decoration: none; text-align: center; cursor: pointer; font: 700 15px/1.15 var(--body); }
.act svg { width: 18px; height: 18px; flex: none; color: var(--gold); }
.act.wide { grid-column: 1 / -1; }
#star { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (min-width: 700px) { video { border-radius: 14px; } }
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <video id="v" src="invite.mp4" poster="poster.jpg" playsinline webkit-playsinline preload="auto" aria-label="Видео-приглашение на первый день рождения Вероники"></video>
    <canvas id="star" aria-hidden="true"></canvas>
    <button class="play" id="play" type="button" aria-label="Открыть приглашение"><i></i></button>
    <button class="fsbtn" id="fs" type="button" hidden aria-label="На весь экран" title="На весь экран">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path id="fsIcon" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <div class="sheet" id="sheet" role="dialog" aria-label="Подтверждение прихода" hidden>
      <button class="x" id="rsvpClose" type="button" aria-label="Закрыть">×</button>
      <h3>Вы придёте?</h3>
      <input class="field" id="rName" type="text" autocomplete="name" placeholder="Ваше имя" maxlength="60">
      <div class="choice">
        <button class="opt" id="optYes" type="button" aria-pressed="false">Буду</button>
        <button class="opt" id="optNo" type="button" aria-pressed="false">Не смогу</button>
      </div>
      <div class="step" id="rCount" hidden>
        <span>Сколько человек</span>
        <div><button id="minus" type="button" aria-label="Меньше">−</button><output id="num">1</output><button id="plus" type="button" aria-label="Больше">+</button></div>
      </div>
      <a class="go off" id="rSend" href="#" target="_blank" rel="noopener" aria-disabled="true">Отправить в WhatsApp</a>
      <p class="hint" id="rHint">Откроется WhatsApp с готовым сообщением, останется нажать «Отправить».</p>
    </div>
    <div class="sheet" id="info" role="dialog" aria-label="Детали праздника" hidden>
      <button class="x" id="infoClose" type="button" aria-label="Закрыть">×</button>
      <h3>Как нас найти</h3>
      <div class="facts">
        <div class="fact">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
          <div><b>28 ноября 2026, суббота</b><span>Начало в 14:30</span></div>
        </div>
        <div class="fact">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>
          <div><b>House of Light</b><span id="addr">Liepājas iela 56, Rīga</span></div>
          <button class="copy" id="copyAddr" type="button">Копировать</button>
        </div>
      </div>
      <div class="acts">
        <a class="act" id="gmaps" href="#" target="_blank" rel="noopener">Google Карты</a>
        <a class="act" id="amaps" href="#" target="_blank" rel="noopener" hidden>Apple Карты</a>
        <a class="act wide" id="album" href="#" target="_blank" rel="noopener" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4.5 4 3 3-2.5 4 3.5"/></svg>
          Фото с праздника
        </a>
      </div>
    </div>
    <div class="thanks" id="thanks" role="status" aria-live="polite">
      <canvas id="confetti" aria-hidden="true"></canvas>
      <div class="thanks-in"><h2 id="thTitle"></h2><p id="thText"></p></div>
      <small>Нажмите, чтобы закрыть</small>
    </div>
    <div class="corner" id="corner">
      <button class="chip round" id="again" type="button" aria-label="Смотреть ещё раз" title="Смотреть ещё раз">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
      <button class="chip glow" id="rsvpOpen" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        Подтвердить
      </button>
      <button class="chip" id="infoOpen" type="button" aria-label="Детали: дата, адрес, маршрут">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.8v.2"/></svg>
        Детали
      </button>
    </div>
  </div>
</div>

<script>
(function () {
  var v = document.getElementById('v'), play = document.getElementById('play'), corner = document.getElementById('corner');
  /* Address as published on houseoflight.lv */
  var Q = 'House of Light, Liepājas iela 56, Rīga';
  /* Google Maps route: opens the Maps app on a phone, the website otherwise */
  document.getElementById('gmaps').href = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(Q);
  /* On phones the links open in the same tab: in-app browsers and some Android browsers swallow target=_blank (the page just flashes and comes back) */
  var UA = navigator.userAgent;
  if (/Android|iPhone|iPad|iPod/i.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1)) {
    ['rSend', 'gmaps', 'amaps', 'album'].forEach(function (id) { var a = document.getElementById(id); if (a) a.removeAttribute('target'); });
  }
  /* WebView of another app (Android "; wv)", iOS without "Safari/"): tell the guest what to do if WhatsApp or Maps will not open */
  var inApp = /; wv\)/.test(UA) || (/iPhone|iPad|iPod/.test(UA) && !/Safari\//.test(UA));
  /* RSVP: answers go to the host's WhatsApp as a ready message (digits only, with country code) */
  var PHONE = '37125999483';
  var enc = encodeURIComponent;
  var ro = document.getElementById('rsvpOpen'), sheet = document.getElementById('sheet'), sendA = document.getElementById('rSend');
  var nameI = document.getElementById('rName'), cntRow = document.getElementById('rCount'), numO = document.getElementById('num'), hint = document.getElementById('rHint');
  var yes = document.getElementById('optYes'), no = document.getElementById('optNo'), answer = null, n = 1;
  if (PHONE) ro.hidden = false;
  /* after the answer is sent, "Подтвердить" stops glowing and "Детали" starts (only when the guest is coming); remembered on this device */
  var infoB = document.getElementById('infoOpen'), KEY = 'veronika-rsvp';
  function applyAnswered(kind) { ro.classList.remove('glow'); if (kind === 'yes') infoB.classList.add('glow'); }
  try {
    if (/[?&]reset\b/.test(location.search)) localStorage.removeItem(KEY);
    var prevAnswer = localStorage.getItem(KEY); if (prevAnswer) applyAnswered(prevAnswer);
  } catch (e) {}

  /* details sheet */
  var info = document.getElementById('info'), amaps = document.getElementById('amaps'), gm = document.getElementById('gmaps');
  var ALBUM = ''; /* link to the shared photo album: paste it here and the button appears after the party */
  var ALBUM_FROM = new Date('2026-11-28T18:00:00+02:00');
  if (/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent)) {
    amaps.hidden = false; amaps.href = 'https://maps.apple.com/?daddr=' + enc(Q);
  } else { gm.classList.add('wide'); }
  if (ALBUM && new Date() >= ALBUM_FROM) { var al = document.getElementById('album'); al.href = ALBUM; al.hidden = false; }
  document.getElementById('infoOpen').addEventListener('click', function () { sheet.hidden = true; info.hidden = false; });
  document.getElementById('infoClose').addEventListener('click', function () { info.hidden = true; });
  var copyB = document.getElementById('copyAddr');
  copyB.addEventListener('click', function () {
    var text = 'House of Light, Liepājas iela 56, Rīga';
    function done() { copyB.textContent = 'Скопировано'; setTimeout(function () { copyB.textContent = 'Копировать'; }, 1800); }
    function pick() {
      var r = document.createRange(); r.selectNodeContents(document.getElementById('addr'));
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      copyB.textContent = 'Выделено';
    }
    try { navigator.clipboard.writeText(text).then(done, pick); } catch (e) { pick(); }
  });
  function msg() {
    var nm = nameI.value.trim().replace(/[*_~`]/g, '');
    /* emoji arrive as "?" in WhatsApp's prefilled text: only the star, the bullet and the line are used */
    var line = '━━━━━━━━━━━━━━━';
    var head = '★ *Вероника · 1 годик*\n' + line + '\n';
    if (answer === 'yes') {
      return head + '• *' + nm + '*\n• с радостью придём!\n• Гостей: *' + n + '*\n' + line
        + '\n• 28 ноября 2026, 14:30\n• House of Light, Liepājas iela 56\n\n_Спасибо за приглашение!_';
    }
    return head + '• *' + nm + '*\n• к сожалению, не сможем прийти\n' + line
      + '\n_Спасибо за приглашение, поздравляем Веронику!_';
  }
  function refresh() {
