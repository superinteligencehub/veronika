<head>

<style>
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
/* Look: emerald night, gold foil, fine hairlines. Italic serif display and spaced capitals, as in the video.
   Layout: the video fills the screen; controls are foil-edged glass pills in the bottom-right corner,
   forms and details open as a framed panel from the bottom edge. */
:root {
  --ink: #04100f;
  --gold: #e6c27a;
  --gold-hi: #ffeab5;
  --cream: #f6ecd3;
  --foil: linear-gradient(105deg, #a97a2a 0%, #f3d98f 24%, #fff4d2 40%, #d6a84a 58%, #f2d78c 78%, #9c6e22 100%);
  --foil-text: linear-gradient(100deg, #d0a04a 0%, #fbe9ae 28%, #fff7dc 44%, #e2b85a 62%, #f7de9a 84%, #c0903a 100%);
  --hair: rgba(230, 194, 122, .55);
  --hair-soft: rgba(230, 194, 122, .2);
  --display: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --body: "Jost", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: radial-gradient(60% 46% at 50% 36%, #164a43 0%, #0a2827 48%, #040f0f 100%) fixed, var(--ink);
  color: var(--cream);
  font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.app { height: 100%; display: flex; align-items: center; justify-content: center; }
.stage { position: relative; height: 100%; width: min(100%, calc(100svh * 9 / 16)); min-height: 0; }
video { display: block; width: 100%; height: 100%; object-fit: contain; background: transparent; cursor: pointer; }

/* gold foil: text and hairline borders */
.sheet h3, .thanks h2, .seal span, .dnum {
  background: var(--foil-text); background-size: 220% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 1px 0 rgba(90, 55, 10, .55)) drop-shadow(0 0 16px rgba(255, 205, 110, .22));
  animation: foilmove 8s ease-in-out infinite;
}
@keyframes foilmove { 0%, 100% { background-position: 0% 0; } 50% { background-position: 100% 0; } }
:is(.chip, .opt, .act, .fsbtn, .x) { position: relative; }
:is(.chip, .opt, .act, .fsbtn, .x)::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: var(--foil); pointer-events: none;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
/* ornament: hairlines with a diamond, the same divider the video uses */
.orn { display: flex; align-items: center; gap: 10px; margin: 0 0 20px; }
.orn::before, .orn::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--hair)); }
.orn::after { transform: scaleX(-1); }
.orn i { width: 7px; height: 7px; transform: rotate(45deg); background: var(--foil); box-shadow: 0 0 10px rgba(255, 214, 130, .6); }
.spark { position: absolute; width: var(--s, 18px); height: var(--s, 18px); color: var(--gold-hi); opacity: .75; pointer-events: none; animation: twinkle 3.6s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: .2; transform: scale(.65); } 50% { opacity: 1; transform: scale(1.1); } }

/* play button */
.play {
  position: absolute; left: 50%; top: 71%; transform: translate(-50%, -50%);
  width: 96px; height: 96px; border-radius: 50%; padding: 0; cursor: pointer;
  border: 1px solid transparent;
  background: radial-gradient(circle at 50% 30%, #2a665f 0%, #0e3533 60%, #072120 100%) padding-box, var(--foil) border-box;
  box-shadow: 0 0 0 7px rgba(5, 22, 21, .55), 0 0 0 8px var(--hair-soft), 0 0 60px rgba(230, 170, 70, .45), inset 0 1px 0 rgba(255, 240, 200, .25);
  display: flex; align-items: center; justify-content: center;
  animation: breathe 2.8s ease-in-out infinite;
  transition: opacity .5s ease, visibility .5s;
}
.play i { width: 0; height: 0; margin-left: 7px; border-left: 26px solid var(--gold-hi); border-top: 16px solid transparent; border-bottom: 16px solid transparent; filter: drop-shadow(0 0 8px rgba(255, 214, 130, .7)); }
.play .ring { position: absolute; left: 50%; top: 50%; width: 196px; height: 196px; margin: -98px 0 0 -98px; color: var(--gold); pointer-events: none; overflow: visible; animation: spin 40s linear infinite; }
.play .cap { position: absolute; top: calc(100% + 60px); left: 50%; transform: translateX(-50%); padding-left: .34em; white-space: nowrap; font: 500 11px/1 var(--body); letter-spacing: .34em; text-transform: uppercase; color: var(--gold); }
.play.gone { opacity: 0; visibility: hidden; pointer-events: none; }
@keyframes breathe { 0%, 100% { transform: translate(-50%, -50%) scale(1) } 50% { transform: translate(-50%, -50%) scale(1.05) } }
@keyframes spin { to { transform: rotate(360deg) } }

/* corner pills */
.corner {
  position: absolute; right: 10px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; justify-content: flex-end; flex-wrap: nowrap; gap: 6px; max-width: calc(100% - 20px);
  opacity: 0; visibility: hidden; transform: translateY(8px);
  transition: opacity 1.1s ease, transform 1.1s ease, visibility 1.1s;
}
.corner.show { opacity: 1; visibility: visible; transform: none; }
.corner .chip { flex: none; white-space: nowrap; }
.chip {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 42px; padding: 0 16px 0 14px; border: 0; border-radius: 999px;
  background: rgba(4, 20, 19, .72); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  box-shadow: 0 6px 24px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 240, 200, .14);
  color: var(--gold-hi); text-decoration: none; cursor: pointer;
  font: 500 11.5px/1 var(--body); letter-spacing: .16em; text-transform: uppercase;
  transition: filter .25s ease, transform .25s ease;
}
.chip:hover { filter: brightness(1.2); }
.chip:active { transform: scale(.97); }
.chip svg { width: 16px; height: 16px; flex: none; color: var(--gold); stroke-width: 1.8; }
.chip.round { width: 42px; padding: 0; display: none; }
.corner.ended .chip.round { display: inline-flex; }
/* RSVP: a soft golden glow and a slow light sweep, so the button gently draws the eye */
#rsvpOpen { overflow: hidden; isolation: isolate; }
#rsvpOpen::after {
  content: ""; position: absolute; top: -20%; bottom: -20%; left: 0; width: 46%; z-index: -1; pointer-events: none;
  background: linear-gradient(100deg, transparent 0%, rgba(255, 236, 190, .5) 50%, transparent 100%);
  transform: translateX(-160%) skewX(-18deg); opacity: 0;
}
.corner.show #rsvpOpen { animation: rsvpGlow 3.2s ease-in-out 1.2s infinite; }
.corner.show #rsvpOpen::after { animation: rsvpSheen 4.2s ease-in-out 1.6s infinite; }
@keyframes rsvpGlow {
  0%, 100% { box-shadow: 0 6px 24px rgba(0, 0, 0, .4), 0 0 8px rgba(240, 205, 130, .15); }
  50% { box-shadow: 0 6px 24px rgba(0, 0, 0, .4), 0 0 22px rgba(240, 205, 130, .5); }
}
@keyframes rsvpSheen {
  0% { transform: translateX(-160%) skewX(-18deg); opacity: 0; }
  12% { opacity: 1; }
  45% { transform: translateX(330%) skewX(-18deg); opacity: 1; }
  55%, 100% { transform: translateX(330%) skewX(-18deg); opacity: 0; }
}
.fsbtn {
  position: absolute; top: 10px; right: 10px; z-index: 4; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center; color: var(--gold);
  background: rgba(4, 20, 19, .6); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.fsbtn svg { width: 17px; height: 17px; stroke-width: 1.8; }
.chip:focus-visible, .play:focus-visible, video:focus-visible, .opt:focus-visible, .act:focus-visible, .copy:focus-visible,
.step button:focus-visible, .go:focus-visible, .x:focus-visible, .fsbtn:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }
@media (max-width: 420px) {
  .chip { height: 40px; padding: 0 13px 0 11px; gap: 6px; font-size: 11px; letter-spacing: .12em; }
  .chip svg { width: 15px; height: 15px; }
  .chip.round { width: 40px; padding: 0; }
}
@media (max-width: 330px) { .corner { flex-wrap: wrap; } }

/* framed panels: RSVP and details */
.sheet {
  position: absolute; left: 10px; right: 10px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  padding: 34px 22px 22px; border-radius: 28px; isolation: isolate; overflow: hidden;
  border: 1px solid transparent;
  background:
    radial-gradient(120% 55% at 50% 0%, rgba(110, 200, 170, .16), transparent 62%) padding-box,
    linear-gradient(180deg, #11433d 0%, #072120 55%, #041615 100%) padding-box,
    var(--foil) border-box;
  box-shadow: 0 -24px 70px rgba(0, 0, 0, .6), 0 0 80px rgba(230, 170, 70, .08);
  transition: opacity .45s ease, transform .45s cubic-bezier(.2, .8, .2, 1), visibility .45s;
}
.sheet::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--grain); opacity: .07; mix-blend-mode: overlay; pointer-events: none; }
.sheet::after { content: ""; position: absolute; inset: 6px; border: 1px solid var(--hair-soft); border-radius: 22px; pointer-events: none; }
.sheet[hidden] { display: block !important; opacity: 0; visibility: hidden; transform: translateY(18px); pointer-events: none; }
#info { max-height: calc(100% - 24px); overflow-y: auto; }
.sheet h3 { margin: 0 0 8px; padding: 0 .1em .12em; font: italic 600 34px/1.1 var(--display); text-align: center; }
.sheet .x { position: absolute; top: 14px; right: 14px; z-index: 1; width: 36px; height: 36px; border: 0; border-radius: 50%; background: none; color: var(--gold); cursor: pointer; font: 300 22px/1 var(--body); }
.field {
  display: block; width: 100%; height: 52px; padding: 0 4px; margin: 0 0 14px; border: 0; border-bottom: 1px solid var(--hair); border-radius: 0;
  background: transparent; color: var(--cream); font: 400 18px/1 var(--body); letter-spacing: .02em; caret-color: var(--gold-hi);
}
.field::placeholder { color: rgba(246, 236, 211, .5); font-size: 12.5px; letter-spacing: .24em; text-transform: uppercase; }
.field:focus { outline: none; border-bottom-color: var(--gold-hi); box-shadow: 0 1px 0 var(--gold-hi), 0 14px 22px -16px rgba(255, 214, 130, .7); }
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 14px; }
.opt {
  height: 52px; border: 0; border-radius: 999px; background: rgba(255, 255, 255, .03); color: var(--cream); cursor: pointer;
  font: 500 12.5px/1 var(--body); letter-spacing: .2em; text-transform: uppercase; transition: background .25s, color .25s, box-shadow .25s;
}
.opt[aria-pressed="true"] { background: var(--foil); color: #0b2a27; box-shadow: 0 8px 26px rgba(230, 170, 70, .35), inset 0 1px 0 rgba(255, 255, 255, .5); }
.step {
  display: flex; align-items: center; justify-content: space-between; margin: 0 0 16px; padding: 0 6px 0 20px; height: 56px;
  border: 1px solid var(--hair-soft); border-radius: 999px; background: rgba(255, 255, 255, .03);
  font: 500 11.5px/1.1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--cream);
}
.step[hidden] { display: none !important; }
.step div { display: flex; align-items: center; gap: 6px; }
.step button { width: 40px; height: 40px; border: 1px solid var(--hair); border-radius: 50%; background: rgba(230, 194, 122, .08); color: var(--gold-hi); font: 500 22px/1 var(--body); cursor: pointer; }
.step output { min-width: 34px; text-align: center; font: italic 600 30px/1 var(--display); color: var(--gold-hi); font-variant-numeric: tabular-nums; }
.go {
  position: relative; overflow: hidden; isolation: isolate; display: flex; align-items: center; justify-content: center;
  height: 58px; border-radius: 999px; text-decoration: none; color: #0b2a27; background: var(--foil);
  font: 600 12.5px/1 var(--body); letter-spacing: .2em; text-transform: uppercase;
  box-shadow: 0 10px 34px rgba(230, 170, 70, .35), inset 0 1px 0 rgba(255, 255, 255, .55), inset 0 -2px 0 rgba(120, 80, 20, .3);
  transition: opacity .2s, transform .2s;
}
.go:active { transform: scale(.985); }
.go::after {
  content: ""; position: absolute; top: -30%; bottom: -30%; left: 0; width: 40%; z-index: -1; pointer-events: none;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .7), transparent);
  transform: translateX(-160%) skewX(-18deg); animation: goSheen 4.6s ease-in-out 1s infinite;
}
@keyframes goSheen { 0% { transform: translateX(-160%) skewX(-18deg); } 45%, 100% { transform: translateX(340%) skewX(-18deg); } }
.go.off { opacity: .4; box-shadow: none; }
.go.off::after { animation: none; opacity: 0; }
.hint { margin: 12px 0 0; min-height: 1.3em; text-align: center; font: italic 500 15px/1.3 var(--display); color: var(--cream); opacity: .82; }

/* details panel */
.facts { display: grid; margin: 0 0 16px; }
.fact { display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-top: 1px solid var(--hair-soft); }
.fact:first-child { border-top: 0; padding-top: 4px; }
.fact > svg { width: 42px; height: 42px; flex: none; padding: 10px; border: 1px solid var(--hair); border-radius: 50%; color: var(--gold); stroke-width: 1.6; }
.fact div { flex: 1; min-width: 0; }
.fact b { display: block; font: italic 600 23px/1.15 var(--display); color: var(--gold-hi); }
.fact span { display: block; margin-top: 6px; font: 400 12px/1.4 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--cream); opacity: .78; }
.copy { display: inline-block; margin-top: 10px; padding: 4px 0; border: 0; border-bottom: 1px solid var(--hair); background: none; color: var(--gold); cursor: pointer; font: 500 10.5px/1 var(--body); letter-spacing: .22em; text-transform: uppercase; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.act {
  display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 12px; border: 0; border-radius: 999px;
  background: rgba(255, 255, 255, .03); color: var(--gold-hi); text-decoration: none; text-align: center; cursor: pointer;
  font: 500 11px/1.15 var(--body); letter-spacing: .12em; text-transform: uppercase;
}
.act svg { width: 17px; height: 17px; flex: none; color: var(--gold); stroke-width: 1.8; }
.act.wide { grid-column: 1 / -1; }

/* thank-you screen after the answer is sent */
.thanks {
  position: absolute; inset: 0; z-index: 7; display: flex; align-items: center; justify-content: center; text-align: center; cursor: pointer; overflow: hidden;
  background: radial-gradient(ellipse at 50% 44%, rgba(8, 40, 36, .82), rgba(3, 14, 13, .92) 75%);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  opacity: 0; visibility: hidden; transition: opacity .7s ease, visibility .7s;
}
.thanks::before { content: ""; position: absolute; inset: 0; background: var(--grain); opacity: .08; mix-blend-mode: overlay; pointer-events: none; }
.thanks.on { opacity: 1; visibility: visible; }
.thanks canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.thanks-in { position: relative; display: flex; flex-direction: column; align-items: center; padding: 0 24px; transform: translateY(16px) scale(.97); transition: transform 1s cubic-bezier(.2, .8, .2, 1) .15s; }
.thanks.on .thanks-in { transform: none; }
.seal {
  display: flex; align-items: center; justify-content: center; width: 78px; height: 78px; margin: 0 0 24px; border-radius: 50%; border: 1px solid transparent;
  background: radial-gradient(circle at 50% 30%, #2a665f 0%, #0b2f2c 70%) padding-box, var(--foil) border-box;
  box-shadow: 0 0 0 6px rgba(5, 22, 21, .6), 0 0 0 7px var(--hair-soft), 0 0 50px rgba(230, 170, 70, .35);
}
.seal span { padding: 0 .08em .1em 0; font: italic 600 42px/1 var(--display); }
.thanks h2 { margin: 0 0 14px; padding: 0 .1em .14em; font: italic 600 clamp(38px, min(12.5vw, 6.8svh), 62px)/1.05 var(--display); }
.thanks .orn { width: min(260px, 70vw); margin: 0 0 22px; }
.thanks p { display: flex; flex-direction: column; align-items: center; margin: 0; font: 400 clamp(13px, min(3.8vw, 2.2svh), 16px)/1.6 var(--body); letter-spacing: .24em; text-transform: uppercase; color: var(--cream); }
.thanks p.soft { font: italic 500 clamp(21px, 6.2vw, 28px)/1.35 var(--display); letter-spacing: .01em; text-transform: none; }
.dnum { padding: 0 .08em .06em; font: italic 600 clamp(84px, min(27vw, 14svh), 128px)/.95 var(--display); }
.dmon { margin-top: 4px; font-size: 1.05em; letter-spacing: .4em; padding-left: .4em; }
.dtime { margin-top: 18px; padding: 18px 0 0; min-width: 150px; border-top: 1px solid var(--hair-soft); color: var(--gold-hi); }
.thanks small { position: absolute; left: 0; right: 0; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); font: 400 10.5px/1 var(--body); color: var(--cream); opacity: .5; letter-spacing: .3em; text-transform: uppercase; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (min-width: 700px) {
  .stage { border-radius: 16px; overflow: hidden; box-shadow: 0 0 0 1px var(--hair-soft), 0 40px 120px rgba(0, 0, 0, .65), 0 0 120px rgba(230, 170, 70, .06); }
  video { border-radius: 16px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <video id="v" src="invite.mp4" poster="poster.jpg" playsinline webkit-playsinline preload="auto" aria-label="Видео-приглашение на первый день рождения Вероники"></video>
    <button class="play" id="play" type="button" aria-label="Открыть приглашение">
      <svg class="ring" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="88" fill="none" stroke="currentColor" stroke-width="2.4" stroke-dasharray="1.2 9.86"/><circle cx="100" cy="100" r="78" fill="none" stroke="currentColor" stroke-width=".7" opacity=".55"/></svg>
      <i></i><span class="cap" aria-hidden="true">Открыть приглашение</span>
    </button>
    <button class="fsbtn" id="fs" type="button" hidden aria-label="На весь экран" title="На весь экран">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path id="fsIcon" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <div class="sheet" id="sheet" role="dialog" aria-label="Подтверждение прихода" hidden>
      <button class="x" id="rsvpClose" type="button" aria-label="Закрыть">×</button>
      <h3>Вы придёте?</h3>
      <div class="orn" aria-hidden="true"><i></i></div>
      <input class="field" id="rName" type="text" autocomplete="name" placeholder="Ваше имя" maxlength="60">
      <div class="choice">
        <button class="opt" id="optYes" type="button" aria-pressed="false">Буду</button>
        <button class="opt" id="optNo" type="button" aria-pressed="false">Не смогу</button>
      </div>
      <div class="step" id="rCount" hidden>
        <span>Сколько человек</span>
        <div><button id="minus" type="button" aria-label="Меньше">−</button><output id="num">1</output><button id="plus" type="button" aria-label="Больше">+</button></div>
      </div>
      <a class="go off" id="rSend" href="#" target="_blank" rel="noopener" aria-disabled="true">Отправить в WhatsApp</a>
      <p class="hint" id="rHint">Откроется WhatsApp с готовым сообщением, останется нажать «Отправить».</p>
    </div>
    <div class="sheet" id="info" role="dialog" aria-label="Детали праздника" hidden>
      <button class="x" id="infoClose" type="button" aria-label="Закрыть">×</button>
      <h3>Как нас найти</h3>
      <div class="orn" aria-hidden="true"><i></i></div>
      <div class="facts">
        <div class="fact">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
          <div><b>28 ноября 2026, суббота</b><span>Начало в 14:30</span></div>
        </div>
        <div class="fact">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>
          <div><b>House of Light</b><span id="addr">Liepājas iela 56, Rīga</span><button class="copy" id="copyAddr" type="button">Копировать</button></div>

      <div class="acts">
        <a class="act" id="gmaps" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>Google Карты</a>
        <a class="act" id="amaps" href="#" target="_blank" rel="noopener" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>Apple Карты</a>

      <svg class="spark" style="--s:14px;left:80%;top:27%;animation-delay:1.4s" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0c.8 7 5 11.2 12 12-7 .8-11.2 5-12 12-.8-7-5-11.2-12-12 7-.8 11.2-5 12-12z"/></svg>
      <svg class="spark" style="--s:26px;left:74%;top:72%;animation-delay:2.2s" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0c.8 7 5 11.2 12 12-7 .8-11.2 5-12 12-.8-7-5-11.2-12-12 7-.8 11.2-5 12-12z"/></svg>
      <svg class="spark" style="--s:12px;left:21%;top:66%;animation-delay:.9s" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0c.8 7 5 11.2 12 12-7 .8-11.2 5-12 12-.8-7-5-11.2-12-12 7-.8 11.2-5 12-12z"/></svg>
      <div class="thanks-in">
        <div class="seal" aria-hidden="true"><span>В</span></div>

        <div class="orn" aria-hidden="true"><i></i></div>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
      <button class="chip" id="rsvpOpen" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        Подтвердить
      </button>
      <button class="chip" id="infoOpen" type="button" aria-label="Детали: дата, адрес, маршрут">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.8v.2"/></svg>

</div>

<script>
(function () {
  var v = document.getElementById('v'), play = document.getElementById('play'), corner = document.getElementById('corner');
  /* Address as published on houseoflight.lv */
  var Q = 'House of Light, Liepājas iela 56, Rīga';
  /* Google Maps route: opens the Maps app on a phone, the website otherwise */
  document.getElementById('gmaps').href = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(Q);
  /* RSVP: answers go to the host's WhatsApp as a ready message (digits only, with country code) */
  var PHONE = '37125999483';
  var enc = encodeURIComponent;
  var ro = document.getElementById('rsvpOpen'), sheet = document.getElementById('sheet'), sendA = document.getElementById('rSend');
  var nameI = document.getElementById('rName'), cntRow = document.getElementById('rCount'), numO = document.getElementById('num'), hint = document.getElementById('rHint');
  var yes = document.getElementById('optYes'), no = document.getElementById('optNo'), answer = null, n = 1;
  if (PHONE) ro.hidden = false;

  /* details sheet */
  var info = document.getElementById('info'), amaps = document.getElementById('amaps'), gm = document.getElementById('gmaps');
  var ALBUM = ''; /* link to the shared photo album: paste it here and the button appears after the party */
  var ALBUM_FROM = new Date('2026-11-28T18:00:00+02:00');
  if (/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent)) {
    amaps.hidden = false; amaps.href = 'https://maps.apple.com/?daddr=' + enc(Q);
  } else { gm.classList.add('wide'); }
  if (ALBUM && new Date() >= ALBUM_FROM) { var al = document.getElementById('album'); al.href = ALBUM; al.hidden = false; }
  document.getElementById('infoOpen').addEventListener('click', function () { sheet.hidden = true; info.hidden = false; });
  document.getElementById('infoClose').addEventListener('click', function () { info.hidden = true; });
  var copyB = document.getElementById('copyAddr');
  copyB.addEventListener('click', function () {
    var text = 'House of Light, Liepājas iela 56, Rīga';
    function done() { copyB.textContent = 'Скопировано'; setTimeout(function () { copyB.textContent = 'Копировать'; }, 1800); }
    function pick() {
      var r = document.createRange(); r.selectNodeContents(document.getElementById('addr'));
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      copyB.textContent = 'Выделено';
    }
    try { navigator.clipboard.writeText(text).then(done, pick); } catch (e) { pick(); }
  });
  function msg() {
    var nm = nameI.value.trim().replace(/[*_~`]/g, '');
    /* emoji arrive as "?" in WhatsApp's prefilled text: only the star, the bullet and the line are used */
    var line = '━━━━━━━━━━━━━━━';
    var head = '★ *Вероника · 1 годик*\n' + line + '\n';
    if (answer === 'yes') {
      return head + '• *' + nm + '*\n• с радостью придём!\n• Гостей: *' + n + '*\n' + line
        + '\n• 28 ноября 2026, 14:30\n• House of Light, Liepājas iela 56\n\n_Спасибо за приглашение!_';
    }
    return head + '• *' + nm + '*\n• к сожалению, не сможем прийти\n' + line
      + '\n_Спасибо за приглашение, поздравляем Веронику!_';
  }
  function refresh() {
    var ok = !!(nameI.value.trim() && answer);
    sendA.classList.toggle('off', !ok); sendA.setAttribute('aria-disabled', ok ? 'false' : 'true');
    sendA.href = ok ? 'https://wa.me/' + PHONE + '?text=' + enc(msg()) : '#';
    cntRow.hidden = answer !== 'yes'; numO.textContent = n;
    yes.setAttribute('aria-pressed', String(answer === 'yes')); no.setAttribute('aria-pressed', String(answer === 'no'));
  }
  function openSheet() { info.hidden = true; sheet.hidden = false; hint.textContent = 'Откроется WhatsApp с готовым сообщением, останется нажать «Отправить».'; }
  ro.addEventListener('click', openSheet);
  document.getElementById('rsvpClose').addEventListener('click', function () { sheet.hidden = true; });
  yes.addEventListener('click', function () { answer = 'yes'; refresh(); });
  no.addEventListener('click', function () { answer = 'no'; refresh(); });
  document.getElementById('minus').addEventListener('click', function () { n = Math.max(1, n - 1); refresh(); });
  document.getElementById('plus').addEventListener('click', function () { n = Math.min(10, n + 1); refresh(); });
  nameI.addEventListener('input', refresh);
  sendA.addEventListener('click', function (e) {
    if (sendA.getAttribute('aria-disabled') === 'true') { e.preventDefault(); hint.textContent = nameI.value.trim() ? 'Выберите «Буду» или «Не смогу».' : 'Напишите, пожалуйста, ваше имя.'; return; }
    hint.textContent = answer === 'no' ? 'Спасибо, что сообщили!' : 'Спасибо! Ждём вас.';
    thanksPending(answer);
  });

  /* thank-you screen: shown when the guest comes back from WhatsApp (or after 1.8 s if the page never lost focus) */
  var thanks = document.getElementById('thanks'), cv = document.getElementById('confetti'), pend = null, timer = 0, raf = 0;
  var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function thanksPending(kind) {
    pend = kind; clearTimeout(timer);
    timer = setTimeout(function () { if (pend) showThanks(pend); }, 1800);
  }
  function showThanks(kind) {
    pend = null; clearTimeout(timer);
    sheet.hidden = true; info.hidden = true;
    var tt = document.getElementById('thText');
    document.getElementById('thTitle').textContent = kind === 'yes' ? 'До скорых встреч!' : 'Спасибо за ответ!';
    if (kind === 'yes') { tt.className = ''; tt.innerHTML = '<span class="dnum">28</span><span class="dmon">ноября</span><span class="dtime">в 14:30</span>'; }
    else { tt.className = 'soft'; tt.textContent = 'Жаль, что не получится.\nБудем думать о вас'; }
    tt.style.whiteSpace = 'pre-line';
    clearCv(); thanks.dataset.kind = kind; thanks.classList.add('on');
    if (kind === 'yes' && !still) confetti();
  }
  function clearCv() { cancelAnimationFrame(raf); var c = cv.getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height); }
  thanks.addEventListener('click', function () { thanks.classList.remove('on'); clearCv(); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (pend) { clearTimeout(timer); } return; }
    if (pend) setTimeout(function () { if (pend) showThanks(pend); }, 350);
    else if (thanks.classList.contains('on') && !still && thanks.dataset.kind !== 'no') setTimeout(confetti, 350);
  });
  function confetti() {
    cancelAnimationFrame(raf);
    var dpr = Math.min(window.devicePixelRatio || 1, 2), w = cv.clientWidth, h = cv.clientHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    var g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    var COL = ['#ffe29a', '#e6c27a', '#f4e8cc', '#ffffff', '#e0a852', '#9fd8cb'], P = [], R = Math.random;
    function add(x, y, vx, vy, delay) {
      P.push({ x: x, y: y, vx: vx, vy: vy, d: delay || 0, c: COL[(R() * COL.length) | 0], w: 6 + R() * 6, h: 9 + R() * 8, a: R() * 6.28, va: (R() - .5) * 9,
        t: R() * 6.28, vt: 4 + R() * 6, round: R() < .22 });
    }
    var k = Math.min(w, 460) / 400;
    for (var i = 0; i < 70; i++) { /* two bursts from the bottom corners */
      var s = (620 + R() * 760) * k, a = -(Math.PI / 2) + (R() - .5) * 0.95;
      add(-6, h * .86, Math.abs(Math.cos(a)) * s * .9 + 60, Math.sin(a) * s - 120, R() * .25);
      add(w + 6, h * .86, -(Math.abs(Math.cos(a)) * s * .9 + 60), Math.sin(a) * s - 120, R() * .25);
    }
    for (var j = 0; j < 70; j++) add(R() * w, -20 - R() * h * .35, (R() - .5) * 90, 90 + R() * 150, .5 + R() * 1.6); /* gentle rain */
    var t0 = performance.now(), last = t0;
    (function step(now) {
      var dt = Math.min((now - last) / 1000, .05), el = (now - t0) / 1000; last = now;
      g.clearRect(0, 0, w, h); var live = 0;
      for (var n2 = 0; n2 < P.length; n2++) {
        var p = P[n2]; if (el < p.d) { live++; continue; }
        p.vy += 760 * dt; var drag = Math.pow(.18, dt); p.vx *= drag; if (p.vy < 0) p.vy *= drag; else p.vy = Math.min(p.vy, 260 + p.w * 6);
        p.x += (p.vx + Math.sin(p.t) * 28) * dt; p.y += p.vy * dt; p.a += p.va * dt; p.t += p.vt * dt;
        if (p.y > h + 30) continue; live++;
        var flip = Math.cos(p.t); g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.scale(1, flip); g.fillStyle = p.c;
        g.globalAlpha = Math.min(1, (h + 30 - p.y) / 120 + .3);
        if (p.round) { g.beginPath(); g.arc(0, 0, p.w / 2.2, 0, 6.28); g.fill(); } else g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        g.restore();
      }
      if (live && el < 9) raf = requestAnimationFrame(step); else g.clearRect(0, 0, w, h);
    })(t0);
  }
  var REVEAL = 15.2; /* seconds: the address is on screen from here */
  function reveal() { corner.classList.add('show'); }
  /* full screen without the address bar (Android and desktop; iPhone Safari does not allow it for pages) */
  var fsBtn = document.getElementById('fs'), started = false;
  function canFull() { var el = document.documentElement; return !!(el.requestFullscreen || el.webkitRequestFullscreen); }
  function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function goFull() {
    var el = document.documentElement, rq = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!rq || isFull()) return;
    try { var r = rq.call(el, { navigationUI: 'hide' }); if (r && r.catch) r.catch(function () {}); } catch (e) {}
  }
  var ICON_IN = 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5', ICON_OUT = 'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5';
  function exitFull() {
    try { var r = (document.exitFullscreen || document.webkitExitFullscreen).call(document); if (r && r.catch) r.catch(function () {}); } catch (e) {}
  }
  function syncFs() {
    fsBtn.hidden = !(started && canFull());
    var full = isFull();
    document.getElementById('fsIcon').setAttribute('d', full ? ICON_OUT : ICON_IN);
    var t = full ? 'Выйти из полного экрана' : 'На весь экран';
    fsBtn.setAttribute('aria-label', t); fsBtn.title = t;
  }
  document.addEventListener('fullscreenchange', syncFs);
  document.addEventListener('webkitfullscreenchange', syncFs);
  fsBtn.addEventListener('click', function () { if (isFull()) exitFull(); else goFull(); setTimeout(syncFs, 400); });
  function start() {
    goFull(); started = true; setTimeout(syncFs, 700);
    play.classList.add('gone');
    var p = v.play(); if (p && p.catch) p.catch(function () { play.classList.remove('gone'); });
  }
  play.addEventListener('click', start);
  v.addEventListener('click', function () {
    if (v.ended) { restart(); return; }
    if (v.paused) start(); else v.pause();
  });
  v.addEventListener('timeupdate', function () { if (v.currentTime >= REVEAL) reveal(); });
  v.addEventListener('ended', function () { reveal(); corner.classList.add('ended'); });
  v.addEventListener('error', function () { reveal(); });
  function restart() { corner.classList.remove('ended'); v.currentTime = 0; start(); }
  document.getElementById('again').addEventListener('click', restart);
})();
</script>
